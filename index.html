<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأة رمضان</title>

<style>
body{
  margin:0;
  font-family: Tahoma, sans-serif;
  background: radial-gradient(circle at top, #0b1d3a, #000);
  color:#fff;
  text-align:center;
  overflow-x:hidden;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

h1{ color:#f5c16c; }

/* فوانيس */
.lantern{
  position:fixed;
  top:-120px;
  width:60px;
  animation:swing 3s ease-in-out infinite;
}
.l1{ left:10%; }
.l2{ left:45%; animation-delay:1s; }
.l3{ left:75%; animation-delay:2s; }

@keyframes swing{
  0%{ transform:rotate(-5deg); }
  50%{ transform:rotate(5deg); }
  100%{ transform:rotate(-5deg); }
}

/* باسورد */
input{
  padding:12px;
  width:80%;
  border-radius:15px;
  border:none;
  font-size:16px;
  text-align:center;
}

button{
  background:#f5c16c;
  color:#000;
  border:none;
  padding:14px 25px;
  font-size:16px;
  border-radius:20px;
  cursor:pointer;
  margin-top:15px;
}

.hidden{ display:none; }

img{
  width:100%;
  border-radius:18px;
  margin-top:20px;
}

.message{
  margin-top:25px;
  line-height:1.9;
  font-size:16px;
}

.countdown{
  display:flex;
  justify-content:space-around;
  margin:20px 0;
}
.box{
  background:#111c2e;
  padding:10px;
  border-radius:12px;
  width:70px;
}
.box span{
  font-size:22px;
  font-weight:bold;
  display:block;
}

audio{
  display:none;
}
#playBtn{
  background:#f5c16c;
  color:#000;
  padding:14px 25px;
  font-size:16px;
  border-radius:20px;
  margin-top:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- فوانيس -->
<img class="lantern l1" src="https://cdn.pixabay.com/photo/2022/03/22/15/40/lantern-7085702_1280.png">
<img class="lantern l2" src="https://cdn.pixabay.com/photo/2022/03/22/15/40/lantern-7085702_1280.png">
<img class="lantern l3" src="https://cdn.pixabay.com/photo/2022/03/22/15/40/lantern-7085702_1280.png">

<!-- شاشة الدخول -->
<div class="container" id="login">
  <h1>💌 مفاجأة</h1>
  <p>ادخلي للمفاجأة يا روحي 💖</p>
  <input type="password" id="password" placeholder="اكتبي الباسورد">
  <br>
  <button onclick="checkPassword()">دخول ✨</button>
  <p id="error" style="color:#ff8080"></p>
</div>

<!-- زر تشغيل المفاجأة -->
<div class="container hidden" id="startContainer">
  <button id="playBtn">تشغيل المفاجأة 🎵🌙</button>
</div>

<!-- المحتوى -->
<div class="container hidden" id="content">
  <h1>رمضان معاكِ أحلى 🌙❤️</h1>

  <!-- موسيقى -->
  <audio id="bgMusic" loop>
    <source src="https://dl1.albumaty.com/mp3/13216.mp3" type="audio/mpeg">
  </audio>

  <!-- العداد -->
  <div class="countdown">
    <div class="box"><span id="days">0</span>يوم</div>
    <div class="box"><span id="hours">0</span>ساعة</div>
    <div class="box"><span id="minutes">0</span>دقيقة</div>
    <div class="box"><span id="seconds">0</span>ثانية</div>
  </div>

  <!-- الرسالة -->
  <div class="message">
    كل سنة وانتي معايا يا نور عيني<br>
    كل سنة وانتي منورة حياتي<br>
    ويعودها علينا تاني وتالت ومليون 😂<br>
    بحبك يا فروحة<br>
    ربنا يخليكي ليا<br>
    يا أجمل حد في الدنيا<br>
    يا ست البنات<br>
    <strong>بعشقك يا فرح ❤️</strong><br><br>
    <strong>من حبيبك بلال 💌</strong>
  </div>

  <!-- الصور النهائية -->
  <img src="https://i.ibb.co/GQm1Q5qP/IMG-20260214-WA0151.jpg">
  <img src="https://i.ibb.co/xSFQ4sbX/IMG-20260214-WA0150.jpg">
  <img src="https://i.ibb.co/C52Sxvgh/IMG-20260214-WA0149.jpg">
  <img src="https://i.ibb.co/pvZy4ctR/IMG-20260214-WA0147.jpg">
  <img src="https://i.ibb.co/GvGx3LjY/IMG-20260214-WA0146.jpg">
</div>

<script>
// الباسورد
function checkPassword(){
  if(document.getElementById("password").value === "farah"){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("startContainer").classList.remove("hidden");
  }else{
    document.getElementById("error").innerText = "الباسورد غلط يا قمر 😅";
  }
}

// زر تشغيل المفاجأة
document.getElementById("playBtn").onclick = function(){
    var audio = document.getElementById("bgMusic");
    audio.play();
    document.getElementById("startContainer").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
};

// عداد رمضان
const targetDate = new Date("2026-02-18T00:00:00").getTime();
setInterval(function(){
  const now = new Date().getTime();
  const diff = targetDate - now;

  document.getElementById("days").innerText = Math.max(0, Math.floor(diff / (1000*60*60*24)));
  document.getElementById("hours").innerText = Math.max(0, Math.floor((diff % (1000*60*60*24)) / (1000*60*60)));
  document.getElementById("minutes").innerText = Math.max(0, Math.floor((diff % (1000*60*60)) / (1000*60)));
  document.getElementById("seconds").innerText = Math.max(0, Math.floor((diff % (1000*60)) / 1000));
}, 1000);
</script>

</body>
</html>
